<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Прогресія — HYBRO Workout Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0A0A0A;
    --card: #141414;
    --border: #262626;
    --chalk: #FFFFFF;
    --dim: #8C8C8C;
    --brass: #E4002B;
    --rust: #7A0018;
    --line: #262626;
    --up: #3ED598;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--chalk);
    padding: 20px 16px 40px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }

  .header { position: relative; padding-left: 16px; margin-bottom: 20px; }
  .header .slash {
    position: absolute; left: 0; top: 2px; bottom: 2px; width: 8px;
    background: var(--brass); transform: skewX(-12deg);
  }
  .header .row { display: flex; align-items: center; justify-content: space-between; }
  .header h1 {
    font-family: 'Oswald', sans-serif; font-size: 34px; font-weight: 700;
    letter-spacing: 0.5px; text-transform: uppercase; line-height: 1; margin: 0;
  }
  .header p { color: var(--dim); font-size: 12.5px; margin: 6px 0 0; font-weight: 500; }
  .header p b { color: var(--chalk); font-weight: 700; }

  .day-header { display: flex; align-items: center; gap: 12px; margin: 24px 0 12px; }
  .day-header:first-of-type { margin-top: 0; }
  .day-tag {
    background: var(--brass); color: #fff; font-family: 'Oswald', sans-serif;
    font-size: 12.5px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    padding: 4px 10px;
  }
  .day-header .rule { flex: 1; height: 1px; background: var(--border); }

  .card {
    background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--brass);
    border-radius: 2px; margin-bottom: 12px; overflow: hidden;
  }
  .card.open { border-color: var(--brass); }
  .card-head {
    width: 100%; background: transparent; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; color: inherit; font: inherit;
  }
  .card-head .left { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .card-head .icon { flex-shrink: 0; display: flex; }
  .card-head .name {
    font-family: 'Inter', sans-serif; font-weight: 800; font-size: 13px;
    letter-spacing: 0.1px; text-transform: uppercase; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; text-align: left;
  }
  .card-head .right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .card-head .weight { text-align: right; }
  .card-head .weight .num { font-family: 'Bebas Neue', sans-serif; font-size: 26px; line-height: 1; letter-spacing: 0.5px; }
  .card-head .weight .unit { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 800; color: var(--brass); margin-left: 3px; }
  .card-head .weight .delta { font-size: 11px; margin-top: 2px; }
  .chevron { transition: transform 0.15s; color: var(--dim); }
  .card.open .chevron { transform: rotate(180deg); }

  .card-body { padding: 0 16px 16px; display: none; }
  .card.open .card-body { display: block; }

  .chart-toggle { display: flex; gap: 6px; margin-bottom: 8px; }
  .chart-toggle button {
    background: transparent; border: 1px solid var(--border); color: var(--dim);
    font-family: 'Oswald', sans-serif; font-size: 11px; letter-spacing: 0.5px; text-transform: uppercase;
    padding: 4px 10px; border-radius: 2px; cursor: pointer;
  }
  .chart-toggle button.active { background: var(--brass); border-color: var(--brass); color: #fff; }

  .chart-empty { height: 70px; color: var(--dim); font-size: 12px; display: flex; align-items: center; justify-content: center; font-style: italic; }
  .chart { width: 100%; height: 90px; }

  .today-box { background: var(--bg); border: 1px solid var(--border); border-radius: 2px; padding: 10px 12px; margin-top: 12px; }
  .today-box .today-title { font-family: 'Oswald', sans-serif; font-size: 11.5px; letter-spacing: 0.8px; text-transform: uppercase; color: var(--dim); margin-bottom: 8px; }
  .today-box .today-title b { color: var(--brass); font-size: 13px; }
  .today-col { display: flex; flex-direction: column; gap: 5px; }
  .today-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
  .today-row .badge {
    background: var(--brass); color: #fff; font-family: 'Bebas Neue', sans-serif; font-size: 12px;
    min-width: 28px; text-align: center; padding: 2px 4px; border-radius: 2px; flex-shrink: 0;
  }
  .today-row .info { flex: 1; }
  .today-row .del { background: none; border: none; color: var(--dim); cursor: pointer; display: flex; flex-shrink: 0; }
  .today-empty { font-size: 12px; color: var(--dim); font-style: italic; }
  .today-box .tonnage { color: var(--dim); font-weight: 500; }

  .pr-icon { color: var(--brass); flex-shrink: 0; display: inline-flex; margin-left: 4px; vertical-align: -2px; }
  .rm-line { font-size: 10.5px; color: var(--dim); margin-top: 2px; }
  .stagnant-tag {
    display: inline-flex; align-items: center; font-size: 9px; color: var(--dim);
    border: 1px solid var(--border); border-radius: 2px; padding: 1px 5px; margin-left: 7px;
    text-transform: uppercase; letter-spacing: 0.5px; font-family: 'Oswald', sans-serif; vertical-align: 1px;
  }

  .rest-box {
    background: var(--card); border: 1px solid var(--brass); border-radius: 2px;
    padding: 10px 12px; margin-top: 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .rest-box .rest-label { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.5px; font-family: 'Oswald', sans-serif; }
  .rest-box .rest-time { font-family: 'Bebas Neue', sans-serif; font-size: 24px; color: var(--brass); letter-spacing: 1px; line-height: 1; }
  .rest-box .rest-actions { display: flex; gap: 6px; }
  .rest-box button {
    background: transparent; border: 1px solid var(--border); color: var(--dim);
    font-family: 'Oswald', sans-serif; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
    padding: 5px 8px; border-radius: 2px; cursor: pointer;
  }

  .btn-repeat {
    background: transparent; border: 1px solid var(--border); color: var(--dim);
    border-radius: 2px; padding: 7px 9px; cursor: pointer; display: inline-flex; align-items: center;
  }

  .header .streak { color: var(--brass); font-weight: 700; }

  .card-head { cursor: pointer; }

  .drag-handle {
    display: flex; align-items: center; justify-content: center; width: 20px; height: 28px;
    flex-shrink: 0; color: var(--dim); cursor: grab; touch-action: none;
  }
  .drag-handle:active { cursor: grabbing; color: var(--brass); }
  .card.drag-source { opacity: 0.3; }
  .card.drop-above { box-shadow: inset 0 3px 0 var(--brass); }
  .card.drop-below { box-shadow: inset 0 -3px 0 var(--brass); }
  .drag-ghost {
    position: fixed; z-index: 999; pointer-events: none;
    background: var(--card); border: 1px solid var(--brass); border-left: 4px solid var(--brass);
    border-radius: 2px; padding: 12px 16px; display: flex; align-items: center; gap: 10px;
    box-shadow: 0 10px 28px rgba(0,0,0,0.65);
    font-family: 'Inter', sans-serif; font-weight: 800; font-size: 13px;
    text-transform: uppercase; color: var(--chalk);
  }

  form.log-form { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px; margin-top: 12px; }
  .field { display: flex; flex-direction: column; }
  .field label { font-size: 10px; color: var(--dim); margin-bottom: 3px; }
  .field input, .field select {
    background: var(--bg); border: 1px solid var(--border); border-radius: 2px;
    padding: 6px 8px; color: var(--chalk); font-size: 12.5px; font-family: inherit;
  }
  .field input:focus, .field select:focus { outline: 1px solid var(--brass); }
  .w-date { width: 118px; }
  .w-weight { width: 90px; }
  .w-reps { width: 84px; }

  .btn {
    border: none; border-radius: 2px; cursor: pointer; font-family: 'Oswald', sans-serif;
    letter-spacing: 0.5px; text-transform: uppercase; display: inline-flex; align-items: center; gap: 5px;
  }
  .btn-primary { background: var(--brass); color: #fff; padding: 7px 14px; font-size: 12px; font-weight: 700; }
  .btn-ghost {
    margin-left: auto; background: transparent; border: 1px solid var(--border); color: var(--dim);
    padding: 7px 9px; border-radius: 2px; cursor: pointer;
  }
  .btn-outline {
    border: 2px solid var(--brass); background: transparent; color: var(--chalk);
    border-radius: 2px; padding: 13px; font-size: 13px; font-weight: 700; cursor: pointer;
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-cancel {
    background: none; border: 1px solid var(--border); border-radius: 2px; padding: 8px 10px;
    color: var(--dim); cursor: pointer; font-family: 'Inter', sans-serif; font-size: 13px;
  }

  .history-toggle { font-size: 11.5px; color: var(--dim); background: none; border: none; cursor: pointer; margin-top: 12px; padding: 0; }
  .history-list { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
  .history-row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; padding: 4px 8px; background: var(--bg); border-radius: 5px; }
  .history-row .d { color: var(--dim); }
  .history-row .del { background: none; border: none; color: var(--dim); cursor: pointer; display: flex; }

  .add-form {
    background: var(--card); border: 1px solid var(--border); border-radius: 2px; padding: 14px;
    display: flex; align-items: flex-end; gap: 8px; flex-wrap: wrap;
  }
  .add-form .field.grow { flex: 1; min-width: 160px; }
  .add-form .w-day { width: 118px; }
  .add-form .w-unit { width: 74px; }

  .empty-state { border: 1px dashed var(--border); border-radius: 2px; padding: 24px; text-align: center; color: var(--dim); font-size: 13px; }

  input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.7); }
</style>
</head>
<body>
  <div class="wrap" id="app"></div>

<script>
const STORAGE_KEY = "hybro-workout-data";
const DAY_ORDER = ["Понеділок", "Середа", "П'ятниця", "Інше"];

function uid() { return Math.random().toString(36).slice(2, 10); }
function todayStr() { return new Date().toISOString().slice(0, 10); }
function fmtDate(d) {
  const dt = new Date(d + "T00:00:00");
  return dt.toLocaleDateString("uk-UA", { day: "2-digit", month: "short" });
}
function esc(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

// ---------- дані ----------
function seedExercises() {
  const counters = {};
  const mk = (name, day) => {
    const order = counters[day] || 0;
    counters[day] = order + 1;
    return { id: uid(), name, unit: "кг", day, order };
  };
  const monday = [
    "Жим штанги на похилій лаві",
    "Жим гантелей на похилій лаві",
    "Підтягування на турніку широким хватом з обтяженням",
    "Розведення гантелей на похилій лаві",
    "Горизонтальна тяга в блоковому тренажері",
    "Вертикальна тяга в блоковому тренажері",
    "Зведення рук у кросовер",
    "Прес нахил в блоці",
  ].map((n) => mk(n, "Понеділок"));
  const wednesday = [
    "Жим штанги на трицепс",
    "Згинання рук зі штангою",
    "Розгинання рук на блоці",
    "Згинання рук зі штангою зворотним хватом",
    "Згинання кистей з гантелями",
    "Підйом ніг у висі",
  ].map((n) => mk(n, "Середа"));
  const friday = [
    "Жим гантелей сидячи",
    "Тяга штанги в нахилі за спиною",
    "Відведення рук з гантелями в сторони",
    "Присідання з поясом",
    "Жим ногами в тренажері",
    "Розгинання ніг у тренажері сидячи",
    "Згинання ніг у тренажері",
    "Підйом на носки",
    "Прес нахил в блоці",
  ].map((n) => mk(n, "П'ятниця"));
  const exercises = [...monday, ...wednesday, ...friday];
  const logs = {};
  exercises.forEach((e) => (logs[e.id] = []));
  return { exercises, logs };
}

function migrateData(existing) {
  let changed = false;
  const counters = {};

  const oldName = "Горизонтальна/вертикальна тяга в блоковому тренажері";
  const idx = existing.exercises.findIndex((ex) => ex.name === oldName);
  if (idx !== -1) {
    const old = existing.exercises[idx];
    const horizontal = { id: uid(), name: "Горизонтальна тяга в блоковому тренажері", unit: old.unit, day: old.day, order: old.order ?? 0 };
    const vertical = { id: uid(), name: "Вертикальна тяга в блоковому тренажері", unit: old.unit, day: old.day, order: (old.order ?? 0) + 0.5 };
    existing.exercises.splice(idx, 1, horizontal, vertical);
    existing.logs[horizontal.id] = existing.logs[old.id] || [];
    existing.logs[vertical.id] = [];
    delete existing.logs[old.id];
    changed = true;
  }

  existing.exercises.forEach((ex) => {
    const day = ex.day || "Інше";
    if (typeof ex.order !== "number") {
      ex.order = counters[day] || 0;
      changed = true;
    }
    counters[day] = Math.max(counters[day] || 0, ex.order + 1);
  });
  Object.keys(existing.logs || {}).forEach((exId) => {
    existing.logs[exId].forEach((l) => {
      if (typeof l.sets !== "number") {
        l.sets = 1;
        changed = true;
      }
    });
  });
  if (changed) saveData(existing);
  return existing;
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return migrateData(JSON.parse(raw));
  } catch (e) {}
  const seeded = seedExercises();
  saveData(seeded);
  return seeded;
}
function saveData(data) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) {
    console.error("Storage error", e);
  }
}

let data = loadData();
let openCards = new Set();
let openHistory = new Set();
let restTimers = {}; // exId -> { endsAt, intervalId }

// ---------- патерн вправи -> іконка ----------
function getExercisePattern(name) {
  const n = (name || "").toLowerCase();
  if (n.includes("ногами")) return "leg-press";
  if (n.includes("носк")) return "calf-raise";
  if (n.includes("присід")) return "squat";
  if (n.includes("ніг") && n.includes("розгинання")) return "leg-extension";
  if (n.includes("ніг") && n.includes("згинання")) return "leg-curl";
  if (n.includes("висі")) return "hanging-leg-raise";
  if (n.includes("прес")) return "core-crunch";
  if (n.includes("підтягування")) return "pull-up";
  if (n.includes("кросовер") || n.includes("розведення")) return "fly";
  if (n.includes("тяга") && n.includes("нахил")) return "bent-over-row";
  if (n.includes("тяга")) return "row";
  if (n.includes("кистей")) return "wrist-curl";
  if (n.includes("розгинання") && n.includes("рук")) return "triceps-pushdown";
  if (n.includes("зворотним")) return "reverse-curl";
  if (n.includes("згинання") && n.includes("рук")) return "bicep-curl";
  if (n.includes("трицепс") && n.includes("жим")) return "triceps-press";
  if (n.includes("трицепс")) return "triceps-pushdown";
  if (n.includes("відведення")) return "lateral-raise";
  if (n.includes("сидячи") && n.includes("жим")) return "shoulder-press";
  if (n.includes("гантел") && n.includes("жим")) return "press-dumbbell";
  if (n.includes("штанг") && n.includes("жим")) return "press-barbell";
  if (n.includes("жим")) return "press-barbell";
  return null;
}

  "bent-over-row": `<line x1="5" y1="6" x2="14" y2="16"/><line x1="9" y1="18" x2="19" y2="18"/><circle cx="9" cy="18" r="1.7" fill="currentColor" stroke="none"/><circle cx="19" cy="18" r="1.7" fill="currentColor" stroke="none"/><path d="M14 15 L14 11"/><path d="M12.5 12.5 L14 11 L15.5 12.5"/>`,

// ---------- дії ----------
function addExercise(name, day, unit) {

function getDayGroupSorted(day) {

}

// ---------- перетягування (затиснути й перемістити) ----------
let dragState = null;
const LONG_PRESS_MS = 300;
const MOVE_CANCEL_PX = 10;

function dragPointerDown(e, handle) {
  const id = handle.dataset.id;
  const ex = data.exercises.find((x) => x.id === id);
  if (!ex) return;
  dragState = {
    id,
    day: ex.day || "Інше",
    startX: e.clientX,
    startY: e.clientY,
    active: false,
    timer: setTimeout(() => activateDrag(), LONG_PRESS_MS),
  };
}

function activateDrag() {
  if (!dragState) return;
  const cardEl = document.querySelector(`.card[data-card="${dragState.id}"]`);
  if (!cardEl) { dragState = null; return; }
  dragState.active = true;
  cardEl.classList.add("drag-source");
  if (navigator.vibrate) navigator.vibrate(12);

  const rect = cardEl.getBoundingClientRect();
  const nameEl = cardEl.querySelector(".name");
  const iconEl = cardEl.querySelector(".icon");
  const ghost = document.createElement("div");
  ghost.className = "drag-ghost";
  ghost.style.width = rect.width + "px";
  ghost.style.left = rect.left + "px";
  ghost.style.top = rect.top + "px";
  ghost.innerHTML = `${iconEl ? iconEl.outerHTML : ""}<span>${nameEl ? nameEl.textContent : ""}</span>`;
  document.body.appendChild(ghost);

  dragState.ghost = ghost;
  dragState.offsetX = dragState.startX - rect.left;
  dragState.offsetY = dragState.startY - rect.top;
}

function dragPointerMove(e) {
  if (!dragState) return;
  const dx = e.clientX - dragState.startX;
  const dy = e.clientY - dragState.startY;
  if (!dragState.active) {
    if (Math.abs(dx) > MOVE_CANCEL_PX || Math.abs(dy) > MOVE_CANCEL_PX) {
      clearTimeout(dragState.timer);
      dragState = null;
    }
    return;
  }
  e.preventDefault();
  dragState.ghost.style.left = e.clientX - dragState.offsetX + "px";
  dragState.ghost.style.top = e.clientY - dragState.offsetY + "px";
  updateDropTarget(e.clientY);
}

function updateDropTarget(clientY) {
  const group = getDayGroupSorted(dragState.day).filter((e) => e.id !== dragState.id);
  let closestId = null, closestBefore = true, closestDist = Infinity;
  group.forEach((ex) => {
    const el = document.querySelector(`.card[data-card="${ex.id}"]`);
    if (!el) return;
    const r = el.getBoundingClientRect();
    const mid = r.top + r.height / 2;
    const dist = Math.abs(clientY - mid);
    if (dist < closestDist) {
      closestDist = dist;
      closestId = ex.id;
      closestBefore = clientY < mid;
    }
  });
  document.querySelectorAll(".card.drop-above, .card.drop-below").forEach((el) => el.classList.remove("drop-above", "drop-below"));
  if (closestId) {
    const el = document.querySelector(`.card[data-card="${closestId}"]`);
    if (el) el.classList.add(closestBefore ? "drop-above" : "drop-below");
  }
  dragState.dropTargetId = closestId;
  dragState.dropBefore = closestBefore;
}

function cleanupDragVisuals() {
  if (dragState && dragState.ghost) dragState.ghost.remove();
  document.querySelectorAll(".card.drag-source").forEach((el) => el.classList.remove("drag-source"));
  document.querySelectorAll(".card.drop-above, .card.drop-below").forEach((el) => el.classList.remove("drop-above", "drop-below"));
}

function dragPointerUp() {
  if (!dragState) return;
  clearTimeout(dragState.timer);
  if (!dragState.active) { dragState = null; return; }
  const { id, day, dropTargetId, dropBefore } = dragState;
  cleanupDragVisuals();
  if (dropTargetId) {
    const group = getDayGroupSorted(day);
    const draggedEx = group.find((e) => e.id === id);
    const rest = group.filter((e) => e.id !== id);
    const targetIdx = rest.findIndex((e) => e.id === dropTargetId);
    const insertAt = dropBefore ? targetIdx : targetIdx + 1;
    rest.splice(insertAt, 0, draggedEx);
    rest.forEach((e, i) => { e.order = i; });
    saveData(data);
  }
  dragState = null;
  render();
}

document.addEventListener("pointerdown", (e) => {
  const handle = e.target.closest(".drag-handle");
  if (!handle) return;
  e.preventDefault();
  dragPointerDown(e, handle);
});
document.addEventListener("pointermove", dragPointerMove, { passive: false });
document.addEventListener("pointerup", dragPointerUp);
document.addEventListener("pointercancel", () => {
  cleanupDragVisuals();
  dragState = null;
});

function deleteExercise(exId) {
  data.exercises = data.exercises.filter((e) => e.id !== exId);
  delete data.logs[exId];

}
function addLog(exId, log) {
  data.logs[exId] = data.logs[exId] || [];
  data.logs[exId].push(log);

}
function deleteLog(exId, logId) {
  data.logs[exId] = (data.logs[exId] || []).filter((l) => l.id !== logId);
  saveData(data);

}

// ---------- рендер ----------

let chartView = {};

function buildChartSeries(sorted, view) {
  const byDate = {};
  sorted.forEach((l) => {
    byDate[l.date] = Math.max(byDate[l.date] ?? -Infinity, l.weight);
  });
  const dateKeys = Object.keys(byDate).sort();
  const now = new Date();
  if (view === "year") {
    const cutoff = new Date(now); cutoff.setFullYear(cutoff.getFullYear() - 1);
    const byMonth = {};
    dateKeys
      .filter((d) => new Date(d + "T00:00:00") >= cutoff)
      .forEach((d) => {
        const key = d.slice(0, 7);
        byMonth[key] = Math.max(byMonth[key] ?? -Infinity, byDate[d]);
      });
    return Object.keys(byMonth)
      .sort()
      .map((key) => {
        const [y, m] = key.split("-");
        const label = new Date(+y, +m - 1, 1).toLocaleDateString("uk-UA", { month: "short" });
        return { label, value: byMonth[key] };
      });
  }
  const cutoff = new Date(now); cutoff.setDate(cutoff.getDate() - 30);
  return dateKeys
    .filter((d) => new Date(d + "T00:00:00") >= cutoff)
    .map((d) => ({ label: fmtDate(d), value: byDate[d] }));
}

function chartSVG(exId, sorted, unit) {
  const view = chartView[exId] || "month";
  const toggle = `<div class="chart-toggle">
    <button data-action="chart-view" data-id="${exId}" data-view="month" class="${view === "month" ? "active" : ""}">Місяць</button>
    <button data-action="chart-view" data-id="${exId}" data-view="year" class="${view === "year" ? "active" : ""}">Рік</button>
  </div>`;

  const series = buildChartSeries(sorted, view);
  if (series.length < 2) {
    return `${toggle}<div class="chart-empty">Потрібно ще принаймні 2 тренувальні ${view === "year" ? "місяці" : "дні"}, щоб порівняти</div>`;
  }
  const w = 600, h = 90, padX = 8, padY = 12;
  const values = series.map((p) => p.value);
  const min = Math.min(...values), max = Math.max(...values);
  const range = max - min || 1;
  const stepX = (w - padX * 2) / (series.length - 1);
  const points = series.map((p, i) => {
    const x = padX + i * stepX;
    const y = h - padY - ((p.value - min) / range) * (h - padY * 2);
    return { x, y, p };
  });
  const poly = points.map((pt) => `${pt.x},${pt.y}`).join(" ");
  const dots = points
    .map((pt) => `<circle cx="${pt.x}" cy="${pt.y}" r="3" fill="var(--brass)"><title>${pt.p.label}: ${pt.p.value} ${unit}</title></circle>`)
    .join("");
  const gridLines = [0.25, 0.5, 0.75]
    .map((f) => `<line x1="0" y1="${h * f}" x2="${w}" y2="${h * f}" stroke="var(--line)" stroke-dasharray="2 4"/>`)
    .join("");
  return `${toggle}<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    ${gridLines}
    <polyline points="${poly}" fill="none" stroke="var(--brass)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    ${dots}
  </svg>`;
}

// ---------- стрік тренувань ----------
function weekStartKey(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  const dow = (d.getDay() + 6) % 7; // 0 = понеділок
  d.setDate(d.getDate() - dow);
  return d.toISOString().slice(0, 10);
}
function computeStreak() {
  const allDates = new Set();
  Object.values(data.logs).forEach((arr) => arr.forEach((l) => allDates.add(l.date)));
  if (!allDates.size) return 0;
  const weekCounts = {};
  allDates.forEach((d) => {
    const k = weekStartKey(d);
    weekCounts[k] = (weekCounts[k] || 0) + 1;
  });
  let streak = 0;
  let first = true;
  let cursor = new Date(weekStartKey(todayStr()) + "T00:00:00");
  while (true) {
    const key = cursor.toISOString().slice(0, 10);
    const count = weekCounts[key] || 0;
    if (count >= 3) {
      streak++;
    } else if (!first) {
      break;
    }
    first = false;
    cursor.setDate(cursor.getDate() - 7);
    if (streak > 520) break; // запобіжник від нескінченного циклу
  }
  return streak;
}

// ---------- 1ПМ (формула Еплі) ----------
function epley1RM(weight, reps) {
  if (!weight || !reps) return null;
  return Math.round(weight * (1 + reps / 30) * 10) / 10;
}

// ---------- особисті рекорди ----------
function prIdsFor(sortedAsc) {
  const ids = new Set();
  let max = -Infinity;
  sortedAsc.forEach((l) => {
    if (l.weight > max) {
      ids.add(l.id);
      max = l.weight;
    }
  });
  return ids;
}

// ---------- тоннаж (вага × повтори) ----------
function tonnageOf(entries) {
  return entries.reduce((sum, l) => sum + l.weight * (l.reps || 0), 0);
}
function totalTonnageToday() {
  let sum = 0;
  Object.values(data.logs).forEach((arr) => {
    sum += tonnageOf(arr.filter((l) => l.date === todayStr()));
  });
  return Math.round(sum);
}

// ---------- індикатор застою ----------
const STAGNATION_WINDOW = 4;
function isStagnant(sortedAsc) {
  const byDate = {};
  sortedAsc.forEach((l) => { byDate[l.date] = Math.max(byDate[l.date] ?? -Infinity, l.weight); });
  const values = Object.keys(byDate).sort().map((d) => byDate[d]);
  if (values.length < STAGNATION_WINDOW) return false;
  const window = values.slice(-STAGNATION_WINDOW);
  return window[window.length - 1] <= window[0];
}

// ---------- таймер відпочинку ----------
function formatRestTime(s) {
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return `${m}:${String(sec).padStart(2, "0")}`;
}
function startRestTimer(exId, seconds = 90) {
  if (restTimers[exId]) clearInterval(restTimers[exId].intervalId);
  restTimers[exId] = { endsAt: Date.now() + seconds * 1000, intervalId: null };
  restTimers[exId].intervalId = setInterval(() => tickRestTimer(exId), 1000);
  render();
}
function tickRestTimer(exId) {
  const t = restTimers[exId];
  if (!t) return;
  const remain = Math.max(0, Math.round((t.endsAt - Date.now()) / 1000));
  const el = document.querySelector(`[data-rest="${exId}"]`);
  if (el) el.textContent = formatRestTime(remain);
  if (remain <= 0) {
    clearInterval(t.intervalId);
    delete restTimers[exId];
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    render();
  }
}
function stopRestTimer(exId) {
  if (restTimers[exId]) {
    clearInterval(restTimers[exId].intervalId);
    delete restTimers[exId];
  }
  render();
}
function extendRestTimer(exId, extraSeconds) {
  if (!restTimers[exId]) return;
  restTimers[exId].endsAt += extraSeconds * 1000;
  tickRestTimer(exId);
}

  let daysHTML = days
    .map((day) => {
      const group = grouped[day].sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
      const cardsHTML = group.map((ex) => exerciseCardHTML(ex)).join("");
      return `
    <div>
      <div class="day-header"><div class="day-tag">${day}</div><div class="rule"></div></div>
      ${cardsHTML}
    </div>`;
    })
    .join("");

  if (!data.exercises.length) {
    daysHTML = `<div class="empty-state">Ще немає жодної вправи.</div>`;
  }

  const addFormHTML = showAddForm
    ? `
    <form class="add-form" data-action="add-exercise">
      <div class="field grow"><label>Назва вправи</label><input type="text" name="name" placeholder="Напр. Жим лежачи" autofocus required/></div>
      <div class="field w-day"><label>День</label>
        <select name="day">
          <option>Понеділок</option><option>Середа</option><option>П'ятниця</option><option>Інше</option>
        </select>
      </div>
      <div class="field w-unit"><label>Одиниця</label>
        <select name="unit"><option value="кг">кг</option><option value="lb">lb</option></select>
      </div>
      <button type="submit" class="btn btn-primary" style="padding:8px 16px;font-size:12.5px">Додати</button>
      <button type="button" class="btn-cancel" data-action="cancel-add">Скасувати</button>
    </form>`
    : `
    <button class="btn-outline" data-action="show-add">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--brass)" stroke-width="2.4"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Додати вправу
    </button>`;

  app.innerHTML = `
    <div class="header">
      <div class="slash"></div>
      <div class="row">
        <h1>Прогресія</h1>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--brass)" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
      </div>
      <p>ЗАЛ 3 РАЗИ НА ТИЖДЕНЬ&nbsp;·&nbsp;<b>${sessions}</b> ${sessions === 1 ? "ТРЕНУВАННЯ ЗАПИСАНО" : "ТРЕНУВАНЬ ЗАПИСАНО"}${streak > 0 ? `<br/>🔥 <span class="streak">${streak}</span> ${streak === 1 ? "тиждень" : streak < 5 ? "тижні" : "тижнів"} поспіль по 3 тренування${tonnageToday ? ` · Тоннаж сьогодні: <b>${tonnageToday}</b> кг` : ""}` : tonnageToday ? `<br/>Тоннаж сьогодні: <b>${tonnageToday}</b> кг` : ""}</p>
    </div>
    ${daysHTML}
    <div style="margin-top: 12px">${addFormHTML}</div>
  `;
}

// ---------- обробники подій (делегування) ----------
document.addEventListener("click", (e) => {
  const target = e.target.closest("[data-action]");
  if (!target) return;
  const action = target.dataset.action;

  if (action === "toggle-card") {
    const id = target.dataset.id;
    if (openCards.has(id)) openCards.delete(id); else openCards.add(id);
    render();
  } else if (action === "toggle-history") {
    const id = target.dataset.id;
    if (openHistory.has(id)) openHistory.delete(id); else openHistory.add(id);
    render();
  } else if (action === "delete-exercise") {
    e.stopPropagation();
    deleteExercise(target.dataset.id);
  } else if (action === "delete-log") {
    deleteLog(target.dataset.ex, target.dataset.log);
  } else if (action === "drag-handle") {
    // клік по ручці не повинен відкривати/закривати картку — саме перетягування обробляється через pointer-події
  } else if (action === "chart-view") {
    e.stopPropagation();
    chartView[target.dataset.id] = target.dataset.view;
    render();
  } else if (action === "repeat-last") {
    e.stopPropagation();
    const form = target.closest("form");
    if (form) {
      form.querySelector('[name="weight"]').value = target.dataset.weight;
      const repsSelect = form.querySelector('[name="reps"]');
      if (repsSelect) repsSelect.value = target.dataset.reps;
    }
  } else if (action === "rest-add30") {
    e.stopPropagation();
    extendRestTimer(target.dataset.id, 30);
  } else if (action === "rest-skip") {
    e.stopPropagation();
    stopRestTimer(target.dataset.id);
  } else if (action === "show-add") {
    showAddForm = true;
    render();
  } else if (action === "cancel-add") {
    showAddForm = false;
    render();
  }
});

document.addEventListener("submit", (e) => {
  const form = e.target.closest("[data-action]");
  if (!form) return;
  e.preventDefault();
  const action = form.dataset.action;

  if (action === "add-log") {
    const id = form.dataset.id;
    const fd = new FormData(form);
    const weight = parseFloat(fd.get("weight"));
    const date = fd.get("date");
    const reps = parseInt(fd.get("reps"), 10);
    if (!weight || weight <= 0 || !date) return;
    openCards.add(id);
    addLog(id, { id: uid(), date, weight, reps, sets: 1 });
    if (date === todayStr()) startRestTimer(id, 90);
  } else if (action === "add-exercise") {
    const fd = new FormData(form);
    const name = (fd.get("name") || "").trim();
    if (!name) return;
    showAddForm = false;
    addExercise(name, fd.get("day"), fd.get("unit"));
  }
});

render();
</script>
</body>
</html>
